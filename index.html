<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Walk through the timeline of Tuhin Chakrabarty — Software Engineer 2 at PayU in Bengaluru. An interactive side-scrolling portfolio: eight stops, a few coins, and the story in between.">
  <meta name="author" content="Tuhin Chakrabarty">
  <meta name="theme-color" content="#070a18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Tuhin Chakrabarty — Interactive Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #070a18;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1100px 620px at 18% 8%, rgba(124, 92, 255, 0.20), transparent 60%),
        radial-gradient(900px 520px at 82% 92%, rgba(34, 211, 238, 0.14), transparent 62%),
        linear-gradient(160deg, #070a18 0%, #0b1026 55%, #140f2c 100%);
      color: #e9edf9;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      outline: none;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #98a2c2;
      background: radial-gradient(800px 500px at 30% 20%, rgba(124, 92, 255, 0.16), transparent 65%);
      z-index: 1000;
    }

    #loading::after {
      content: "";
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #7c5cff, transparent);
      animation: sweep 1.4s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 100% { opacity: 0.25; transform: scaleX(0.6); }
      50% { opacity: 1; transform: scaleX(1); }
    }

    /* Portrait gate: the world is a side-scroller, so ask for landscape. */
    #rotate-hint {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
      background:
        radial-gradient(700px 500px at 50% 35%, rgba(124, 92, 255, 0.22), transparent 66%),
        #070a18;
    }

    #rotate-hint svg {
      width: 74px;
      height: 74px;
      color: #a78bfa;
      animation: nudge 2.6s ease-in-out infinite;
    }

    #rotate-hint h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    #rotate-hint p {
      max-width: 300px;
      font-size: 14px;
      line-height: 1.55;
      color: #98a2c2;
    }

    @keyframes nudge {
      0%, 55%, 100% { transform: rotate(0deg); }
      70%, 85% { transform: rotate(-90deg); }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint { display: flex; }
      #game-container { visibility: hidden; }
      #loading { display: none; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading</div>
  <div id="game-container"></div>

  <div id="rotate-hint" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
      <path d="M10.5 5.5h3" />
      <circle cx="12" cy="17.5" r="0.9" fill="currentColor" />
      <path d="M4 10.5a8 8 0 0 1 2.2-5.4" opacity="0.55" />
      <path d="M4 4.5v6h6" opacity="0.55" />
    </svg>
    <h2>Rotate your device</h2>
    <p>This journey is a side-scroller. Turn your phone to landscape to walk the timeline.</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
