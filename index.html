<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Walk through the timeline of Tuhin Chakrabarty — Software Engineer 2 at PayU in Bengaluru. An interactive side-scrolling portfolio: eight stops, a few coins, and the story in between.">
  <meta name="author" content="Tuhin Chakrabarty">
  <meta name="theme-color" content="#070a18">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Tuhin Chakrabarty — Interactive Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1100px 620px at 18% 8%, rgba(124, 92, 255, 0.20), transparent 60%),
        radial-gradient(900px 520px at 82% 92%, rgba(34, 211, 238, 0.14), transparent 62%),
        linear-gradient(160deg, #070a18 0%, #0b1026 55%, #140f2c 100%);
      color: #e9edf9;
      -webkit-font-smoothing: antialiased;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 14px;
      box-shadow:
        0 30px 80px -20px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      touch-action: none;
    }

    /* Loading screen */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #98a2c2;
      z-index: 1000;
    }

    #loading::after {
      content: "";
      display: block;
      width: 120px;
      height: 2px;
      margin: 14px auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #7c5cff, transparent);
      animation: sweep 1.4s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 100% { opacity: 0.25; transform: scaleX(0.6); }
      50% { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="loading">Loading</div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
